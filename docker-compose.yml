services:
  # --- Base de Datos ---
  db:
    image: postgres:15-alpine
    container_name: achvmate_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Backend (NestJS + Prisma) ---
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: achvmate_api
    restart: always
    # Eliminamos entrypoint y command manuales para usar los del Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    # Solo mapeamos volúmenes si estamos en modo desarrollo (aquí comentados o quitados para que use la imagen)
    # volumes:
    #   - ./apps/api:/app/apps/api 
    #   - ./package.json:/app/package.json
    #   - ./turbo.json:/app/turbo.json
    #   - /app/node_modules 

  # --- Frontend (Next.js) ---
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: achvmate_web
    restart: always
    ports:
      - "3001:3000"
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    volumes:
      - ./apps/web:/app/apps/web  # Mapeo exacto al workspace
      - ./package.json:/app/package.json
      - /app/node_modules
      - /app/apps/web/.next

volumes:
  postgres_data: