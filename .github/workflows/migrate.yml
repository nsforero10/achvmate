name: Database Migration

on:
  push:
    branches:
      - main

jobs:
  migrate:
    name: Run Prisma Migrations
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Prisma Deploy
        env:
          # Binds your GitHub Secret securely directly into the compiler hook.
          # We purposefully map the DIRECT_URL secret over the DATABASE_URL variable since prisma.config.ts explicitly expects it!
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
        run: npm run db:migrate
